<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A 24-hour ring, warm at night (top) and cold at noon (bottom), with the light in the middle -->
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A2E"/>
      <stop offset="0.55" stop-color="#FFE2BC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#day)" stroke-width="14"/>
  <circle cx="50" cy="50" r="12" fill="#FFB36B"/>
</svg>
