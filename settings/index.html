<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <style>
    /* Two views: an overview of every room (what the lights do right now),
       and a room's page with a 24h clock that both shows and edits its plan.
       Colours follow the phone's / computer's light or dark mode; Homey's app
       may also mark dark mode with a class on <html>. Light colours drawn on
       the clock come from the light's colour temperature, not from here. */
    :root {
      color-scheme: light dark;
      --bg: #f2f3f6;
      --surface: #ffffff;
      --text: #1d2230;
      --muted: #5f6777;
      --faint: #8a91a0;
      --border: #dcdfe6;
      --border-soft: #eceef2;
      --track: #e5e8ee;
      --accent: #2f62d0;
      --danger: #c4372b;
      --warn: #b36b00;
      --ok: #2e8b57;
      --sun: #f2b233;
      --shadow: 0 1px 3px rgba(20, 30, 50, 0.08);
      /* Daylight is drawn near-white: outline it, and put the clock on a
         darker disc, so it never melts into a white page */
      --edge: rgba(20, 30, 50, 0.22);
      --dial-bg: #d9dee6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --surface: #1c2129;
        --text: #e8eaf0;
        --muted: #a0a7b5;
        --faint: #7d8494;
        --border: #313846;
        --border-soft: #262c37;
        --track: #2a303c;
        --accent: #6f9bff;
        --danger: #ff7a6b;
        --warn: #f0a640;
        --ok: #5fd08f;
        --shadow: none;
        --edge: rgba(255, 255, 255, 0.10);
        --dial-bg: #14181e;
      }
    }
    :root.homey-dark-mode {
      --bg: #12151c;
      --surface: #1c2129;
      --text: #e8eaf0;
      --muted: #a0a7b5;
      --faint: #7d8494;
      --border: #313846;
      --border-soft: #262c37;
      --track: #2a303c;
      --accent: #6f9bff;
      --danger: #ff7a6b;
      --warn: #f0a640;
      --ok: #5fd08f;
      --shadow: none;
      --edge: rgba(255, 255, 255, 0.10);
      --dial-bg: #14181e;
    }

    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; line-height: 1.4; background: var(--bg); color: var(--text); }
    html body h1, html body h2, html body h3 { margin: 0 !important; padding: 0 !important; color: var(--text) !important; font-family: inherit !important; font-weight: 700 !important; line-height: 1.25 !important; text-transform: none !important; letter-spacing: normal !important; }
    html body h1 { font-size: 22px !important; }
    html body h3 { font-size: 13px !important; color: var(--muted) !important; font-weight: 600 !important; text-transform: uppercase !important; letter-spacing: .04em !important; }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .hint { font-size: 12.5px; color: var(--muted); margin: 0; }
    /* Homey's app puts its own button styling on settings pages; "html body"
       and !important make these base rules win over it. */
    html body button { -webkit-appearance: none !important; appearance: none !important; font: inherit !important; line-height: 1.3 !important; text-transform: none !important; letter-spacing: normal !important; height: auto !important; min-height: 0 !important; min-width: 0 !important; width: auto !important; margin: 0 !important; box-shadow: none !important; color: var(--text) !important; background: var(--surface) !important; border: 1px solid var(--border) !important; border-radius: 8px !important; padding: 7px 12px !important; cursor: pointer !important; }
    html body button:disabled { opacity: .5 !important; cursor: default !important; }
    html body button.primary { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; font-weight: 600 !important; }
    html body button.link { border: 0 !important; background: none !important; color: var(--accent) !important; padding: 4px 0 !important; }
    html body button.danger { color: var(--danger) !important; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    html body input[type="text"], html body input[type="time"], html body input[type="number"] { -webkit-appearance: none !important; appearance: none !important; font: inherit !important; height: auto !important; margin: 0 !important; box-shadow: none !important; background: var(--surface) !important; color: var(--text) !important; border: 1px solid var(--border) !important; border-radius: 6px !important; padding: 4px 6px !important; }
    html body input[type="time"], html body input[type="number"] { width: 96px !important; }
    html body label { font: inherit !important; color: inherit !important; text-transform: none !important; letter-spacing: normal !important; margin: 0 !important; padding: 0 !important; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    input.temp-slider { -webkit-appearance: none; appearance: none; height: 12px; border-radius: 6px; outline: none; background: linear-gradient(to right, #c9e2ff 0%, #fff6ec 40%, #ffd6a0 70%, #ff9d3c 100%); }
    input.temp-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #333; cursor: pointer; }
    input.temp-slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #333; cursor: pointer; }

    .stack { display: grid; gap: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; }
    .row label { flex: 1; }
    .section { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 14px; padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow); }
    .sub-row { padding-left: 16px; }

    /* A span, not a button, so Homey's button styling never reaches it. The
       whole switch (plus some margin) is the tap target; the knob glides. */
    .switch { display: inline-block; position: relative; flex: none; width: 50px; height: 30px; border-radius: 15px; background: var(--track); cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background-color .25s ease; }
    .switch::before { content: ""; position: absolute; inset: -8px; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .25s cubic-bezier(.3, .7, .4, 1); }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(20px); }
    .switch:active::after { width: 28px; }
    .switch[aria-checked="true"]:active::after { transform: translateX(16px); }
    .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .seg { display: flex; background: var(--track); border-radius: 10px; padding: 3px; gap: 3px; }
    html body .seg button { flex: 1 !important; border: 0 !important; background: transparent !important; color: var(--muted) !important; padding: 7px 8px !important; border-radius: 8px !important; font-size: 14px !important; }
    html body .seg button[aria-pressed="true"] { background: var(--surface) !important; color: var(--text) !important; font-weight: 600 !important; box-shadow: 0 1px 3px rgba(0,0,0,.15) !important; }

    .banner { border-radius: 10px; padding: 8px 12px; font-size: 13.5px; background: var(--surface); border: 1px solid var(--warn); color: var(--warn); }

    /* Overview */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
    .room { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 16px; padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow); }
    .room.off .room-now, .room.off .strip, .room.off .lamps { opacity: .5; }
    .room-head { display: flex; align-items: center; gap: 10px; }
    .glow { width: 24px; height: 24px; border-radius: 50%; flex: none; }
    html body .room-head h2 { font-size: 18px !important; flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .chip { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
    .room-now { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .room-now .big { font-size: 20px; font-weight: 700; }
    .strip { position: relative; height: 12px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--edge); }
    .strip .now { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--text); }
    .strip-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: -6px; }
    .lamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    html body .lamp { border: 1px solid var(--border-soft) !important; background: transparent !important; border-radius: 12px !important; padding: 10px 6px !important; display: grid !important; justify-items: center !important; gap: 4px !important; text-align: center !important; cursor: default !important; }
    html body button.lamp { cursor: pointer !important; }
    .bulb { width: 36px; height: 36px; border-radius: 50%; }
    .bulb.off { box-shadow: inset 0 0 0 2px var(--border); }
    .lamp .n { font-size: 13px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
    .lamp .s { font-size: 11.5px; color: var(--muted); }
    html body .lamp.locked { border-color: var(--danger) !important; }
    .lamp.locked .s, .lamp.error .s { color: var(--danger); }
    .room-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--border-soft); padding-top: 10px; }
    .room-foot .toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .overview-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    /* Room page */
    .back-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    html body input.group-name { width: 100% !important; font-size: 22px !important; font-weight: 700 !important; color: var(--text) !important; border: 0 !important; border-bottom: 1px solid var(--border) !important; border-radius: 0 !important; background: transparent !important; padding: 4px 0 !important; }
    .dial-wrap { display: grid; justify-items: center; gap: 6px; }
    svg.dial { width: 100%; max-width: 330px; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
    svg.dial text { font-family: inherit; }
    .dial-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; max-width: 330px; }
    .kf-panel { display: grid; gap: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .kf-list { display: grid; gap: 2px; font-size: 13px; }
    html body .kf-row { display: flex !important; align-items: center !important; gap: 8px !important; border: 0 !important; background: transparent !important; border-radius: 6px !important; padding: 5px 6px !important; text-align: left !important; width: 100% !important; }
    html body .kf-row[aria-pressed="true"] { background: var(--track) !important; font-weight: 600 !important; }
    .kf-row .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px var(--edge); }
    .devices-list { display: grid; }
    .device { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding: 6px 0; border-bottom: 1px solid var(--border-soft); }
    .tag { font-size: 12px; color: var(--faint); }
    .tag.locked { color: var(--danger); }
    .simulate-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

    /* History graph */
    .history { position: relative; }
    svg.history-chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
    svg.history-chart text { font-family: inherit; font-size: 10px; fill: var(--faint); }
    html body .history-seg button { white-space: nowrap !important; padding: 5px 10px !important; font-size: 13px !important; }
    .history-readout { font-size: 12.5px; color: var(--muted); min-height: 1.4em; }
    .history-readout b { color: var(--text); font-variant-numeric: tabular-nums; }

    /* Save bar */
    /* Room for the last section to scroll up above the fixed save bar. A
       spacer inside the content, since Homey's app may override the body's
       own padding. */
    #app::after { content: ""; display: block; height: calc(96px + env(safe-area-inset-bottom, 0px)); }
    .savebar { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; }
    .savebar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border-top: 1px solid var(--border); }
    .savebar .msg { flex: 1; font-size: 13px; color: var(--muted); }
    .savebar .msg.dirty { color: var(--warn); }
    .savebar .msg.ok { color: var(--ok); }

    @media (prefers-reduced-motion: reduce) { *, *::after { transition: none !important; } }
  </style>
</head>
<body>

  <div id="app">Laster...</div>

  <div class="savebar">
    <span class="msg" id="saveMsg"></span>
    <button type="button" id="applyNow">Bruk nå</button>
    <button type="button" class="primary" id="save">Lagre</button>
  </div>

  <script type="text/javascript" src="circadian.js"></script>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <script type="text/javascript">
    const C = window.Circadian;
    const SVG = 'http://www.w3.org/2000/svg';
    const WEEKEND_LABEL = 'Egen plan for helg og røde dager';

    let HomeyRef = null;
    let devices = [];
    let sensors = []; // devices with a light sensor (measure_luminance)
    let config = { enabled: true, groups: [] };
    let status = null;
    let savedJson = '';
    let view = { name: 'overview', groupId: null };
    let refreshDial = null; // redraws the clock and point editor on a room's page
    const roomUi = {}; // groupId -> { tab, selected } (kept while switching views)

    // --- small helpers ---

    function h(tag, props, children) {
      const e = document.createElement(tag);
      Object.entries(props || {}).forEach(([k, v]) => {
        if (v == null || v === false) return;
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else if (k === 'style') e.style.cssText = v;
        else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? '' : v);
      });
      (children || []).forEach((c) => { if (c != null) e.append(c); });
      return e;
    }

    function s(tag, attrs, parent) {
      const e = document.createElementNS(SVG, tag);
      Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
      if (parent) parent.appendChild(e);
      return e;
    }

    function makeId() {
      return 'g-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function defaultGroup() {
      return {
        id: makeId(),
        name: 'Nytt rom',
        deviceIds: [],
        enabled: true,
        mode: 'sun',
        useSunTimes: true,
        wakeTime: '06:30',
        sleepTime: '22:00',
        transitionMinutes: 60,
        warmValue: 1,
        coolValue: 0,
        adjustBrightness: false,
        nightDim: 0.4,
        dayDim: 1,
        keyframes: [],
        skipOffLights: true,
        fadeSeconds: 2,
        weekendEnabled: false,
        weekendWakeTime: '08:30',
        weekendSleepTime: '23:30',
        weekendKeyframes: [],
        wakeUpEnabled: false,
        wakeUpTime: '06:30',
        wakeUpWeekendTime: '',
        wakeUpMinutes: 20,
        luxEnabled: false,
        luxSensorId: null,
        luxDark: 50,
        luxBright: 500,
        luxMinFactor: 0.3,
      };
    }

    function pct(v) { return v == null ? '–' : Math.round(v * 100) + ' %'; }
    function hhmm(m) {
      m = ((Math.round(m) % 1440) + 1440) % 1440;
      return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    }
    function toMin(str) { const [hh, mm] = String(str).split(':').map(Number); return (hh || 0) * 60 + (mm || 0); }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    // light_temperature (0 = coldest, 1 = warmest) shown as an approximate
    // light colour: 6500 K .. 2200 K, then Tanner Helland's kelvin -> RGB.
    function lightRgb(t) {
      const k = (6500 - clamp(t, 0, 1) * 4300) / 100;
      let r, g, b;
      if (k <= 66) { r = 255; g = 99.47 * Math.log(k) - 161.12; } else { r = 329.7 * Math.pow(k - 60, -0.1332); g = 288.12 * Math.pow(k - 60, -0.0755); }
      if (k >= 66) b = 255; else if (k <= 19) b = 0; else b = 138.52 * Math.log(k - 10) - 305.04;
      return [r, g, b].map((v) => Math.round(clamp(v, 0, 255)));
    }
    function lightCss(t, alpha) {
      const [r, g, b] = lightRgb(t == null ? 0.55 : t);
      return alpha == null ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${alpha})`;
    }
    function tempWords(t) {
      if (t == null) return '';
      return t >= 0.7 ? 'varmt lys' : t >= 0.35 ? 'nøytralt lys' : 'kaldt dagslys';
    }

    // "Now" on the Homey's own clock (its time zone may differ from the phone's)
    function homeyNow() {
      const tz = status && status.timeZone ? status.timeZone : undefined;
      const d = new Date();
      const minutes = C.zonedMinutesOfDay(d, tz);
      const free = C.freeDays(d, tz);
      return { minutes, free, weekend: C.isWeekendAt(free, minutes) };
    }
    function sunTimes() {
      return (status && status.sun) || { sunriseMinutes: null, sunsetMinutes: null };
    }
    function valuesAt(group, minutes, weekend) {
      return C.groupValues(group, minutes, sunTimes(), weekend);
    }

    function lightStatus(id) {
      if (!status) return null;
      for (const g of status.groups || []) {
        const l = (g.lights || []).find((x) => x.id === id);
        if (l) return l;
      }
      return null;
    }
    // Lights still in a group although Homey no longer has them (deleted, or
    // re-paired, which gives a light a new id)
    function missingIds(group) {
      return (group.deviceIds || []).filter((id) => {
        const l = lightStatus(id);
        if (l) return !!l.missing;
        return devices.length > 0 && !devices.some((d) => d.id === id);
      });
    }

    function missingNote(group, onRemoved) {
      const ids = missingIds(group);
      if (ids.length === 0) return null;
      const n = ids.length;
      return h('div', { class: 'banner' }, [
        (n === 1 ? '1 lys' : n + ' lys') + ' i rommet finnes ikke lenger i Homey (slettet, eller paret på nytt og fått ny ID). ',
        h('button', {
          type: 'button',
          class: 'link',
          text: n === 1 ? 'Fjern det fra rommet' : 'Fjern dem fra rommet',
          onclick: () => {
            group.deviceIds = group.deviceIds.filter((id) => !ids.includes(id));
            onRemoved();
          },
        }),
      ]);
    }

    function deviceName(id) {
      const d = devices.find((x) => x.id === id);
      return d ? d.name : 'Ukjent lys';
    }

    // --- saving ---

    function isDirty() { return JSON.stringify(config) !== savedJson; }
    function updateSaveBar(text, cls) {
      const msg = document.getElementById('saveMsg');
      const dirty = isDirty();
      document.getElementById('save').disabled = !dirty;
      if (text) {
        msg.textContent = text;
        msg.className = 'msg ' + (cls || '');
        return;
      }
      msg.textContent = dirty ? 'Endringer er ikke lagret' : '';
      msg.className = 'msg' + (dirty ? ' dirty' : '');
    }
    function save() {
      return HomeyRef.api('POST', '/config', config).then(() => {
        savedJson = JSON.stringify(config);
        updateSaveBar('Lagret ✓', 'ok');
        setTimeout(() => updateSaveBar(), 2000);
        return loadStatus();
      }).catch((err) => {
        updateSaveBar('Kunne ikke lagre: ' + (err && err.message ? err.message : err), 'dirty');
      });
    }

    function loadStatus() {
      return HomeyRef.api('GET', '/status').then((st) => {
        status = st;
        if (view.name === 'overview') renderSoon();
        else if (refreshDial) refreshDial();
      }).catch(() => { /* keep showing the last status; the next refresh retries */ });
    }

    // Re-rendering replaces the switch, which would cut its animation short;
    // renders asked for while a switch is gliding wait until it's done.
    const SWITCH_MS = 260;
    let holdRenderUntil = 0;
    let pendingRender = null;
    function renderSoon() {
      const wait = holdRenderUntil - Date.now();
      if (wait <= 0) { render(); return; }
      clearTimeout(pendingRender);
      pendingRender = setTimeout(render, wait);
    }

    function switchButton(on, label, onChange) {
      const b = h('span', { class: 'switch', role: 'switch', tabindex: '0', 'aria-checked': String(!!on), 'aria-label': label });
      const toggle = () => {
        const next = b.getAttribute('aria-checked') !== 'true';
        b.setAttribute('aria-checked', String(next));
        holdRenderUntil = Date.now() + SWITCH_MS;
        onChange(next);
      };
      b.addEventListener('click', toggle);
      b.addEventListener('keydown', (evt) => {
        if (evt.key === ' ' || evt.key === 'Enter') { evt.preventDefault(); toggle(); }
      });
      return b;
    }

    // --- overview ---

    function renderOverview(root) {
      root.append(h('div', { class: 'top' }, [
        h('h1', { text: 'Døgnrytmelys' }),
        h('div', { class: 'row', style: 'min-height:0' }, [
          h('span', { class: 'small muted', text: config.enabled !== false ? 'På' : 'Av' }),
          switchButton(config.enabled !== false, 'Døgnrytmestyring for hele appen', (on) => {
            config.enabled = on;
            save();
            renderSoon();
          }),
        ]),
      ]));

      if (config.enabled === false) {
        root.append(h('div', { class: 'banner', text: 'Døgnrytmestyring er skrudd av for hele appen. Lysene styres ikke.' }));
      }
      if (config.groups.length === 0) {
        root.append(h('p', { class: 'muted', text: 'Ingen rom ennå. Lag et rom og velg hvilke lys som skal følge døgnrytmen.' }));
      }

      const now = homeyNow();
      config.groups.forEach((group) => root.append(roomCard(group, now)));

      root.append(h('div', { class: 'overview-actions' }, [
        h('button', {
          type: 'button',
          text: '+ Nytt rom',
          onclick: () => {
            const g = defaultGroup();
            config.groups.push(g);
            openRoom(g.id);
          },
        }),
        h('button', {
          type: 'button',
          text: 'Lås opp alle lys',
          onclick: () => HomeyRef.api('POST', '/resume-all').then(loadStatus)
            .catch((err) => updateSaveBar('Kunne ikke låse opp: ' + err.message, 'dirty')),
        }),
      ]));

      root.append(buildBackup());
    }

    // --- backup: all settings as text, to keep somewhere safe and paste back ---

    function buildBackup() {
      const box = h('details', { class: 'section' }, [h('summary', { class: 'small muted', text: 'Sikkerhetskopi av innstillingene' })]);
      const msg = h('p', { class: 'hint' });
      const area = h('textarea', { rows: '6', style: 'width:100%; font: 12px ui-monospace, monospace; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px;', 'aria-label': 'Innstillinger som tekst' });

      const copyBtn = h('button', { type: 'button', text: 'Kopier innstillingene' });
      copyBtn.addEventListener('click', () => {
        const text = JSON.stringify({ app: 'com.oystein.circadian', saved: new Date().toISOString(), config: JSON.parse(savedJson) });
        area.value = text;
        const done = () => { msg.textContent = 'Kopiert. Lim teksten inn et trygt sted, f.eks. i et notat eller en e-post til deg selv.'; };
        const manual = () => {
          area.focus();
          area.select();
          msg.textContent = 'Teksten er markert i feltet over. Kopier den derfra.';
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, manual);
        else manual();
      });

      let armed = false;
      const restoreBtn = h('button', { type: 'button', text: 'Gjenopprett fra teksten' });
      restoreBtn.addEventListener('click', () => {
        let parsed;
        try {
          parsed = JSON.parse(area.value);
        } catch (err) {
          msg.textContent = 'Lim inn teksten fra en sikkerhetskopi i feltet over først.';
          return;
        }
        const cfg = parsed && parsed.config ? parsed.config : parsed;
        if (!cfg || !Array.isArray(cfg.groups)) {
          msg.textContent = 'Teksten ser ikke ut som en sikkerhetskopi fra Døgnrytmelys.';
          return;
        }
        if (!armed) {
          armed = true;
          restoreBtn.textContent = 'Trykk igjen for å erstatte alle innstillingene';
          setTimeout(() => { armed = false; restoreBtn.textContent = 'Gjenopprett fra teksten'; }, 5000);
          return;
        }
        config = normalizeConfig(cfg);
        save().then(render);
      });

      box.append(h('p', { class: 'hint', text: 'Innstillingene overlever oppdateringer, men ikke at appen avinstalleres eller Homey tilbakestilles. Kopier dem og ta vare på teksten. Lys som er paret på nytt etterpå, må velges på nytt i rommene.' }));
      box.append(h('div', { class: 'simulate-row' }, [copyBtn, restoreBtn]));
      box.append(area);
      box.append(msg);
      return box;
    }

    // Fill in what a room's page would otherwise add on first visit, so just
    // looking at a room never counts as an unsaved change
    function normalizeConfig(cfg) {
      const c = Object.assign({ enabled: true, groups: [] }, cfg || {});
      if (!Array.isArray(c.groups)) c.groups = [];
      if (!c.calibration || typeof c.calibration !== 'object') c.calibration = {};
      c.groups.forEach((g) => {
        if (!Array.isArray(g.deviceIds)) g.deviceIds = [];
        if (!Array.isArray(g.keyframes)) g.keyframes = [];
        if (!Array.isArray(g.weekendKeyframes)) g.weekendKeyframes = [];
      });
      return c;
    }

    function groupStatus(group) {
      return status && (status.groups || []).find((g) => g.id === group.id);
    }

    function daylightText(group) {
      const g = groupStatus(group);
      if (!group.luxEnabled || !g || g.lux == null) return '';
      return ' · dagslys ' + g.lux + ' lux';
    }

    function roomCard(group, now) {
      const enabled = group.enabled !== false && config.enabled !== false;
      const v = valuesAt(group, now.minutes, now.weekend);
      const weekendNow = now.weekend && group.weekendEnabled;

      const stops = [];
      for (let hr = 0; hr <= 24; hr++) {
        const m = Math.min(hr * 60, 1439);
        stops.push(lightCss(valuesAt(group, m, C.isWeekendAt(now.free, m)).temp) + ' ' + (hr / 24 * 100).toFixed(1) + '%');
      }

      const glow = h('span', { class: 'glow' });
      glow.style.background = enabled ? lightCss(v.temp) : 'var(--track)';
      glow.style.boxShadow = 'inset 0 0 0 1px var(--edge)'
        + (enabled ? ', 0 0 ' + Math.round(6 + (v.dim == null ? 0.7 : v.dim) * 16) + 'px ' + lightCss(v.temp, 0.8) : '');

      const missing = missingIds(group);
      const present = (group.deviceIds || []).filter((id) => !missing.includes(id));
      const lamps = h('div', { class: 'lamps' });
      present.forEach((id) => lamps.append(lampTile(id)));
      if (present.length === 0) {
        lamps.append(h('span', { class: 'hint', text: 'Ingen lys valgt ennå.' }));
      }

      const marker = h('span', { class: 'now' });
      marker.style.left = 'calc(' + (now.minutes / 1440 * 100).toFixed(2) + '% - 1.5px)';
      const strip = h('div', { class: 'strip' }, [marker]);
      strip.style.background = 'linear-gradient(to right, ' + stops.join(',') + ')';

      return h('div', { class: 'room' + (enabled ? '' : ' off') }, [
        h('div', { class: 'room-head' }, [
          glow,
          h('h2', { text: group.name || 'Uten navn' }),
          h('span', { class: 'chip', text: (group.mode === 'keyframes' ? 'Egne punkter' : 'Følger sola') + (weekendNow ? ' · helg' : '') }),
        ]),
        h('div', { class: 'room-now' }, [
          h('span', { class: 'big num', text: 'Varme ' + pct(v.temp) + (v.dim != null ? ' · lys ' + pct(v.dim) : '') }),
          h('span', { class: 'small muted', text: enabled ? tempWords(v.temp) + ' nå' + daylightText(group) : 'skrudd av' }),
        ]),
        strip,
        h('div', { class: 'strip-labels' }, ['00', '06', '12', '18', '24'].map((t) => h('span', { text: t }))),
        lamps,
        missingNote(group, () => { save(); render(); }),
        h('div', { class: 'room-foot' }, [
          h('div', { class: 'toggle' }, [
            switchButton(group.enabled !== false, 'Døgnrytme for ' + (group.name || 'rommet'), (on) => {
              group.enabled = on;
              save();
              renderSoon();
            }),
            h('span', { text: 'Døgnrytme' }),
          ]),
          h('button', { type: 'button', class: 'link', text: 'Endre plan ›', onclick: () => openRoom(group.id) }),
        ]),
      ]);
    }

    function lampTile(id) {
      const l = lightStatus(id);
      const name = l ? l.name : deviceName(id);
      let text = 'Venter på status';
      let color = null;
      let strength = 0.6;
      if (l) {
        if (l.on === false) text = 'Av';
        else if (l.on) {
          color = lightCss(l.temp);
          strength = l.dim == null ? 0.7 : l.dim;
          text = (l.temp != null ? 'varme ' + pct(l.temp) + ' · ' : '') + 'lys ' + pct(l.dim);
        }
        if (l.lock) text = (l.lock === 'untilOff' ? 'Pause til av' : 'Låst') + ' · trykk for å låse opp';
        else if (l.waking) text = 'Soloppgangsvekking · ' + text;
        else if (l.status && l.status.check === 'error') text = l.status.text;
      }
      const bulb = h('span', { class: 'bulb' + (color ? '' : ' off') });
      if (color) {
        bulb.style.background = color;
        bulb.style.boxShadow = 'inset 0 0 0 1px var(--edge), 0 0 ' + Math.round(4 + strength * 20) + 'px ' + color;
      }
      const cls = 'lamp' + (l && l.lock ? ' locked' : '') + (l && !l.lock && l.status && l.status.check === 'error' ? ' error' : '');
      const children = [bulb, h('span', { class: 'n', text: name }), h('span', { class: 's', text })];
      if (l && l.lock) {
        return h('button', {
          type: 'button',
          class: cls,
          'aria-label': name + ': ' + text,
          onclick: () => HomeyRef.api('POST', '/resume', { deviceId: id }).then(loadStatus)
            .catch((err) => updateSaveBar('Kunne ikke låse opp: ' + err.message, 'dirty')),
        }, children);
      }
      return h('div', { class: cls, title: l && l.status ? l.status.text : '' }, children);
    }

    // --- room page ---

    function openRoom(groupId) {
      view = { name: 'room', groupId };
      render();
      window.scrollTo(0, 0);
    }

    function renderRoom(root, group) {
      const ui = roomUi[group.id] || (roomUi[group.id] = { tab: 'weekday', selected: -1 });
      if (!group.weekendEnabled) ui.tab = 'weekday';
      if (!Array.isArray(group.keyframes)) group.keyframes = [];
      if (!Array.isArray(group.weekendKeyframes)) group.weekendKeyframes = [];

      const nameInput = h('input', { type: 'text', class: 'group-name', 'aria-label': 'Navn på rommet', placeholder: 'Navn på rommet' });
      nameInput.value = group.name || '';
      nameInput.addEventListener('input', () => { group.name = nameInput.value; });

      root.append(h('div', { class: 'back-row' }, [
        h('button', { type: 'button', class: 'link', text: '‹ Alle rom', onclick: () => { view = { name: 'overview' }; render(); } }),
        h('div', { class: 'row', style: 'min-height:0' }, [
          h('span', { class: 'small muted', text: 'Døgnrytme' }),
          switchButton(group.enabled !== false, 'Døgnrytme for rommet', (on) => { group.enabled = on; updateSaveBar(); }),
        ]),
      ]));
      root.append(nameInput);

      root.append(h('div', { class: 'seg', role: 'group', 'aria-label': 'Plan' }, [
        ['sun', 'Følg sola'], ['keyframes', 'Egne punkter'],
      ].map(([id, text]) => h('button', {
        type: 'button',
        'aria-pressed': String((group.mode || 'sun') === id),
        text,
        onclick: () => { group.mode = id; ui.selected = -1; render(); },
      }))));

      // Plan: weekend switch, weekday/weekend tabs, the clock
      const plan = h('div', { class: 'section' });
      plan.append(h('div', { class: 'row' }, [
        h('label', { text: WEEKEND_LABEL }),
        switchButton(!!group.weekendEnabled, WEEKEND_LABEL, (on) => { group.weekendEnabled = on; renderSoon(); }),
      ]));
      if (group.weekendEnabled) {
        plan.append(h('p', { class: 'hint', text: 'Gjelder fra kl. 12 dagen før en lørdag, søndag eller rød dag (også julaften og nyttårsaften) til kl. 12 på dagen. Kvelden før en arbeidsdag følger hverdagsplanen.' }));
      }
      if (group.weekendEnabled) {
        plan.append(h('div', { class: 'seg', role: 'group', 'aria-label': 'Vis plan for' }, [
          ['weekday', 'Hverdag'], ['weekend', 'Helg'],
        ].map(([id, text]) => h('button', {
          type: 'button',
          'aria-pressed': String(ui.tab === id),
          text,
          onclick: () => { ui.tab = id; ui.selected = -1; render(); },
        }))));
      }

      const kfHolder = h('div', { class: 'stack' });
      const redrawEditor = () => renderKeyframeEditor(kfHolder, group, ui, () => dial.redraw());
      const dial = buildDial(group, ui, redrawEditor);
      plan.append(dial.el);
      if (group.mode === 'keyframes') {
        plan.append(kfHolder);
        redrawEditor();
      }
      root.append(plan);
      root.append(buildHistory(group));
      refreshDial = () => { dial.redraw(); if (group.mode === 'keyframes') redrawEditor(); };

      if (group.mode !== 'keyframes') {
        const sunBox = h('div', { class: 'section' }, [h('h3', { text: 'Sola og tider' })]);
        sunBox.append(buildSunControls(group, dial.redraw));
        root.append(sunBox);
      }

      const lightsBox = h('div', { class: 'section' }, [
        h('h3', { text: 'Lys i rommet' }),
        missingNote(group, render),
      ]);
      const list = h('div', { class: 'devices-list' });
      renderDeviceList(list, group);
      lightsBox.append(list);
      lightsBox.append(buildTestColor(group));
      root.append(lightsBox);

      const wake = h('div', { class: 'section' }, [h('h3', { text: 'Vekking' })]);
      wake.append(buildWakeUpControls(group));
      root.append(wake);

      const daylight = h('div', { class: 'section' }, [h('h3', { text: 'Dagslys' })]);
      daylight.append(buildDaylightControls(group));
      root.append(daylight);

      const more = h('div', { class: 'section' }, [h('h3', { text: 'Mer' })]);
      more.append(buildCommonControls(group));
      more.append(buildSimulateRow(group));
      root.append(more);

      let armed = false;
      const del = h('button', { type: 'button', class: 'danger', text: 'Slett rommet' });
      del.addEventListener('click', () => {
        if (!armed) {
          armed = true;
          del.textContent = 'Trykk igjen for å slette (lagres når du trykker Lagre)';
          setTimeout(() => { armed = false; del.textContent = 'Slett rommet'; }, 4000);
          return;
        }
        config.groups = config.groups.filter((g) => g.id !== group.id);
        view = { name: 'overview' };
        render();
      });
      root.append(del);
    }

    /**
     * The 24-hour clock: an outer ring in the light's colour, brightness as
     * bars inside it, and a hand that shows now (drag it to look at another
     * time). With "Egne punkter" the points sit on the ring: tap the ring to
     * add one, drag a point to move it, drag it into the middle to delete it.
     */
    function buildDial(group, ui, onPointsChanged) {
      const SIZE = 320, CX = 160, R = 112, RING = 22, CENTRE = 58;
      const svg = s('svg', { class: 'dial', viewBox: '0 0 ' + SIZE + ' ' + SIZE, role: 'img', 'aria-label': 'Døgnklokke med lysfarge og lysstyrke' });
      let preview = null;
      let drag = null; // { type: 'point', index, overTrash } | { type: 'hand' }
      const resetBtn = h('button', { type: 'button', class: 'link', text: 'Tilbake til nå', hidden: true });
      const hint = h('p', { class: 'hint' });
      const wrap = h('div', { class: 'dial-wrap' }, [svg, h('div', { class: 'dial-foot' }, [hint, resetBtn])]);
      resetBtn.addEventListener('click', () => { preview = null; redraw(); });

      const isKf = () => group.mode === 'keyframes';
      const weekend = () => ui.tab === 'weekend';
      const points = () => (weekend() ? group.weekendKeyframes : group.keyframes);
      const pos = (m, r) => { const a = (m / 1440) * 2 * Math.PI; return [CX + r * Math.sin(a), CX - r * Math.cos(a)]; };
      const minutesAt = (x, y) => {
        let a = Math.atan2(x - CX, CX - y);
        if (a < 0) a += 2 * Math.PI;
        return Math.round((a / (2 * Math.PI)) * 1440 / 5) * 5 % 1440;
      };
      function arc(m0, m1, r) {
        const [x0, y0] = pos(m0, r), [x1, y1] = pos(m1, r);
        return 'M' + x0.toFixed(2) + ',' + y0.toFixed(2) + ' A' + r + ',' + r + ' 0 0 1 ' + x1.toFixed(2) + ',' + y1.toFixed(2);
      }
      function label(x, y, str, style) {
        const t = s('text', { x, y, 'text-anchor': 'middle' }, svg);
        t.textContent = str;
        t.style.cssText = style;
      }

      function redraw() {
        svg.innerHTML = '';
        const now = homeyNow();
        const at = preview != null ? preview : now.minutes;
        const val = (m) => valuesAt(group, m, weekend());

        // Disc behind ring and bars, and outlines on the ring, so near-white
        // daylight stays visible on a light page
        const disc = s('circle', { cx: CX, cy: CX, r: R + RING / 2 }, svg);
        disc.style.fill = 'var(--dial-bg)';

        // Colour ring and brightness bars
        for (let m = 0; m < 1440; m += 10) {
          s('path', { d: arc(m, m + 10.6, R), fill: 'none', stroke: lightCss(val(m + 5).temp), 'stroke-width': RING }, svg);
        }
        for (let m = 0; m < 1440; m += 20) {
          const v = val(m);
          if (v.dim == null) continue;
          const [x0, y0] = pos(m, R - RING / 2 - 5), [x1, y1] = pos(m, R - RING / 2 - 5 - v.dim * 34);
          s('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: lightCss(v.temp), 'stroke-width': 2.4, 'stroke-linecap': 'round' }, svg);
        }

        [R + RING / 2, R - RING / 2].forEach((r) => {
          const edge = s('circle', { cx: CX, cy: CX, r, fill: 'none', 'stroke-width': 1 }, svg);
          edge.style.stroke = 'var(--edge)';
        });

        // Hour ticks and labels
        for (let hr = 0; hr < 24; hr++) {
          const major = hr % 6 === 0;
          const [x0, y0] = pos(hr * 60, R + RING / 2 + 3), [x1, y1] = pos(hr * 60, R + RING / 2 + (major ? 9 : 6));
          const l = s('line', { x1: x0, y1: y0, x2: x1, y2: y1, 'stroke-width': major ? 2 : 1 }, svg);
          l.style.stroke = major ? 'var(--muted)' : 'var(--border)';
        }
        [0, 6, 12, 18].forEach((hr) => {
          const [x, y] = pos(hr * 60, R + RING / 2 + 21);
          label(x, y + 4, String(hr).padStart(2, '0'), 'fill: var(--muted); font-size: 12px;');
        });

        // Sun (or the fixed / weekend wake and sleep times)
        if (!isKf()) {
          const sun = sunTimes();
          const useSun = !weekend() && group.useSunTimes !== false && sun.sunriseMinutes != null;
          const marks = useSun
            ? [[sun.sunriseMinutes, 'Soloppgang'], [sun.sunsetMinutes, 'Solnedgang']]
            : weekend()
              ? [[toMin(group.weekendWakeTime || group.wakeTime), 'Våkne (helg)'], [toMin(group.weekendSleepTime || group.sleepTime), 'Legge seg (helg)']]
              : [[toMin(group.wakeTime), 'Våkne'], [toMin(group.sleepTime), 'Legge seg']];
          marks.forEach(([m, title]) => {
            const [x, y] = pos(m, R + RING / 2 + 6);
            const c = s('circle', { cx: x, cy: y, r: 5 }, svg);
            c.style.fill = 'var(--sun)';
            s('title', {}, c).textContent = title + ' ' + hhmm(m);
          });
        }

        // Points. An empty weekend list falls back to the weekday points:
        // those are shown faint, and the first tap on the ring starts a
        // weekend list of its own.
        if (isKf()) {
          const ghost = weekend() && points().length === 0;
          (ghost ? group.keyframes : points()).forEach((k, i) => {
            const [x, y] = pos(toMin(k.time), R);
            const selected = !ghost && i === ui.selected;
            const c = s('circle', { cx: x, cy: y, r: 8 + (k.dim || 0) * 5, fill: lightCss(k.temp), 'stroke-width': selected ? 3.5 : 2 }, svg);
            c.style.stroke = selected ? 'var(--accent)' : 'var(--text)';
            if (ghost) {
              c.setAttribute('opacity', '0.35');
              c.style.pointerEvents = 'none';
            } else {
              c.dataset.index = i;
              c.style.cursor = 'grab';
              if (drag && drag.type === 'point' && drag.index === i && drag.overTrash) c.setAttribute('opacity', '0.35');
            }
          });
        }

        // Hand
        const [hx, hy] = pos(at, R + RING / 2 + 6);
        const handColour = preview != null ? 'var(--accent)' : 'var(--text)';
        const hand = s('line', { x1: CX, y1: CX, x2: hx, y2: hy, 'stroke-width': 2, 'stroke-linecap': 'round' }, svg);
        hand.style.stroke = handColour;
        const knob = s('circle', { cx: hx, cy: hy, r: 6, 'stroke-width': 2 }, svg);
        knob.style.fill = 'var(--surface)';
        knob.style.stroke = handColour;

        // Centre: values at the hand, or a bin while a point is dragged
        const centre = s('circle', { cx: CX, cy: CX, r: CENTRE, 'stroke-width': 1 }, svg);
        if (drag && drag.type === 'point') {
          centre.style.fill = drag.overTrash ? 'var(--danger)' : 'var(--surface)';
          centre.style.stroke = 'var(--danger)';
          label(CX, CX + 5, 'Slipp her for å slette', 'fill: ' + (drag.overTrash ? '#fff' : 'var(--danger)') + '; font-size: 11.5px;');
        } else {
          centre.style.fill = 'var(--surface)';
          centre.style.stroke = 'var(--border)';
          const v = val(at);
          label(CX, CX - 24, (preview != null ? 'kl. ' : 'nå ') + hhmm(at), 'fill: var(--muted); font-size: 12px;');
          label(CX, CX + 6, pct(v.temp), 'fill: var(--text); font-size: 26px; font-weight: 700;');
          label(CX, CX + 24, tempWords(v.temp), 'fill: var(--muted); font-size: 11.5px;');
          if (v.dim != null) label(CX, CX + 40, 'lysstyrke ' + pct(v.dim), 'fill: var(--muted); font-size: 11.5px;');
        }

        resetBtn.hidden = preview == null;
        hint.textContent = isKf()
          ? 'Trykk på ringen for å legge til et punkt. Dra et punkt for å flytte det, eller inn i midten for å slette det.'
          : 'Ringen viser lysfargen, strekene lysstyrken. Dra viseren for å se en annen tid.';
      }

      function svgPoint(evt) {
        const p = svg.createSVGPoint();
        p.x = evt.clientX;
        p.y = evt.clientY;
        const ctm = svg.getScreenCTM();
        return ctm ? p.matrixTransform(ctm.inverse()) : { x: CX, y: CX };
      }

      svg.addEventListener('pointerdown', (evt) => {
        const p = svgPoint(evt);
        const dist = Math.hypot(p.x - CX, p.y - CX);
        const idx = evt.target.dataset ? evt.target.dataset.index : undefined;
        if (idx != null) {
          ui.selected = Number(idx);
          drag = { type: 'point', index: ui.selected, overTrash: false };
          onPointsChanged();
        } else if (isKf() && Math.abs(dist - R) <= RING / 2 + 6) {
          // Tap on the ring: a new point with the values the plan has there now
          const m = minutesAt(p.x, p.y);
          const v = valuesAt(group, m, weekend());
          const round = (x, fallback) => Math.round((x == null ? fallback : x) * 20) / 20;
          points().push({ time: hhmm(m), temp: round(v.temp, 0.7), dim: round(v.dim, 0.7) });
          ui.selected = points().length - 1;
          drag = { type: 'point', index: ui.selected, overTrash: false };
          onPointsChanged();
        } else if (dist > CENTRE) {
          drag = { type: 'hand' };
          preview = minutesAt(p.x, p.y);
        } else {
          return;
        }
        svg.setPointerCapture(evt.pointerId);
        evt.preventDefault();
        redraw();
      });
      svg.addEventListener('pointermove', (evt) => {
        if (!drag) return;
        const p = svgPoint(evt);
        if (drag.type === 'hand') {
          preview = minutesAt(p.x, p.y);
        } else {
          drag.overTrash = Math.hypot(p.x - CX, p.y - CX) < CENTRE;
          if (!drag.overTrash) points()[drag.index].time = hhmm(minutesAt(p.x, p.y));
        }
        redraw();
      });
      const endDrag = () => {
        if (!drag) return;
        const wasPoint = drag.type === 'point';
        if (wasPoint && drag.overTrash) {
          points().splice(drag.index, 1);
          ui.selected = -1;
        }
        drag = null;
        redraw();
        if (wasPoint) {
          onPointsChanged();
          updateSaveBar();
        }
      };
      svg.addEventListener('pointerup', endDrag);
      svg.addEventListener('pointercancel', endDrag);

      redraw();
      return { el: wrap, redraw };
    }

    function renderKeyframeEditor(holder, group, ui, redrawDial) {
      holder.innerHTML = '';
      const list = ui.tab === 'weekend' ? group.weekendKeyframes : group.keyframes;

        dimInput.value = kf.dim;
        dimInput.addEventListener('input', () => { kf.dim = Number(dimInput.value); dimLabel.textContent = 'Lysstyrke: ' + pct(kf.dim); redrawDial(); });
        dimInput.addEventListener('change', again);

        holder.append(h('div', { class: 'kf-panel' }, [
          h('div', { class: 'row' }, [h('b', { text: 'Valgt punkt' }), timeInput]),

          h('div', { class: 'row' }, [
            h('span'),
            h('button', {
              type: 'button',
              class: 'danger',
              text: 'Slett punkt',
              onclick: () => { list.splice(ui.selected, 1); ui.selected = -1; redrawDial(); again(); updateSaveBar(); },

      const rows = [...list].sort((a, b) => toMin(a.time) - toMin(b.time)).map((k) => {
        const i = list.indexOf(k);

        sw.style.background = lightCss(k.temp);
        return h('button', {
          type: 'button',
          class: 'kf-row num',
          'aria-pressed': String(i === ui.selected),
          onclick: () => { ui.selected = i; redrawDial(); again(); },
        }, [sw, k.time + '  ·  varme ' + pct(k.temp) + '  ·  lys ' + pct(k.dim)]);
      });
      holder.append(h('div', { class: 'kf-list' }, rows));
    }

    function labeledRow(labelText, inputEl, cls) {

    // --- history: what the lights were given, from the app's Insights logs ---

    const historyCache = {}; // `${groupId}:${range}` -> { at, data }
    const historyRange = {}; // groupId -> 'day' | 'week'

    function buildHistory(group) {
      const range = historyRange[group.id] || 'day';
      const box = h('div', { class: 'section' }, [
        h('div', { class: 'row', style: 'min-height:0' }, [
          h('h3', { text: 'Historikk' }),
          h('div', { class: 'seg history-seg', role: 'group', 'aria-label': 'Tidsrom' }, [
            ['day', 'Siste døgn'], ['week', 'Siste uke'],
          ].map(([id, text]) => h('button', {
            type: 'button',
            'aria-pressed': String(range === id),
            text,
            onclick: () => { historyRange[group.id] = id; renderSoon(); },
          }))),
        ]),
      ]);
      const holder = h('div', { class: 'stack', style: 'gap:8px' }, [h('p', { class: 'hint', text: 'Henter...' })]);
      box.append(holder);

      const key = group.id + ':' + range;
      const cached = historyCache[key];
      const show = (data) => {
        holder.innerHTML = '';
        if (!data.dim.length && !data.temp.length) {
          holder.append(h('p', { class: 'hint', text: 'Ingen historikk ennå. Appen logger hvert 2. minutt mens døgnrytmen er på, så grafen fylles etter hvert.' }));
          return;
        }
        holder.append(historyChart(data));
        if (data.lux.length) holder.append(luxChart(data));
        holder.append(h('p', { class: 'hint', text: 'Høyden er lysstyrken lysene fikk, og fargen er lysfargen. Dra fingeren over grafen for å se verdiene. De samme tallene finnes i Homey under Insights.' }));
      };
      if (cached && Date.now() - cached.at < 120000) show(cached.data);
      else {
        HomeyRef.api('GET', '/history?groupId=' + encodeURIComponent(group.id) + '&range=' + range).then((data) => {
          historyCache[key] = { at: Date.now(), data };
          show(data);
        }).catch((err) => {
          holder.innerHTML = '';
          holder.append(h('p', { class: 'hint', text: 'Kunne ikke hente historikk: ' + (err && err.message ? err.message : err) }));
        });
      }
      return box;
    }

    // Shared geometry for the two graphs, so their time axes line up
    const HW = 320, HPAD_L = 38, HPAD_R = 6;
    function historyFrame(data) {
      const end = Date.now();
      const start = end - (data.range === 'week' ? 7 : 1) * 24 * 3600 * 1000;
      const x = (t) => HPAD_L + ((t - start) / (end - start)) * (HW - HPAD_L - HPAD_R);
      return { start, end, x };
    }

    // Split a series where the log has a hole (e.g. the room was switched off)
    function segments(points) {
      if (points.length < 2) return [points];
      const steps = points.slice(1).map((p, i) => p[0] - points[i][0]).sort((a, b) => a - b);
      const gap = steps[Math.floor(steps.length / 2)] * 4;
      const out = [[points[0]]];
      for (let i = 1; i < points.length; i++) {
        if (points[i][0] - points[i - 1][0] > gap) out.push([]);
        out[out.length - 1].push(points[i]);
      }
      return out;
    }

    function timeTicks(frame, range, svg, top, bottom) {
      const ticks = [];
      const d = new Date(frame.start);
      d.setMinutes(0, 0, 0);
      const stepH = range === 'week' ? 24 : 6;
      if (range === 'week') d.setHours(24); else d.setHours(Math.ceil(d.getHours() / 6) * 6);
      for (let t = d.getTime(); t <= frame.end; t += stepH * 3600 * 1000) ticks.push(t);
      ticks.forEach((t) => {
        const x = frame.x(t);
        const l = s('line', { x1: x, x2: x, y1: top, y2: bottom, 'stroke-width': 1 }, svg);
        l.style.stroke = 'var(--border-soft)';
        const label = s('text', { x, y: bottom + 12, 'text-anchor': 'middle' }, svg);
        label.textContent = range === 'week'
          ? new Date(t).toLocaleDateString('nb-NO', { weekday: 'short' }).replace('.', '')
          : String(new Date(t).getHours()).padStart(2, '0');
      });
    }

    function historyChart(data) {
      const H = 150, TOP = 8, BOTTOM = 128;
      const frame = historyFrame(data);
      const y = (v) => BOTTOM - (v / 100) * (BOTTOM - TOP);
      const svg = s('svg', { class: 'history-chart', viewBox: '0 0 ' + HW + ' ' + H, role: 'img', 'aria-label': 'Lysstyrke og lysfarge ' + (data.range === 'week' ? 'siste uke' : 'siste døgn') });

      [0, 50, 100].forEach((v) => {
        const l = s('line', { x1: HPAD_L, x2: HW - HPAD_R, y1: y(v), y2: y(v), 'stroke-width': 1 }, svg);
        l.style.stroke = v === 0 ? 'var(--border)' : 'var(--border-soft)';
        const t = s('text', { x: HPAD_L - 4, y: y(v) + 3, 'text-anchor': 'end' }, svg);
        t.textContent = v + ' %';
      });
      timeTicks(frame, data.range, svg, TOP, BOTTOM);

      // Brightness, or full height for rooms that only follow colour
      const dimSeries = data.dim.length ? data.dim : data.temp.map(([t]) => [t, 100]);

      // Fill coloured by the light colour along time
      const gradId = 'hg' + Math.random().toString(36).slice(2, 7);
      const grad = s('linearGradient', { id: gradId, x1: '0', x2: String(HW), y1: '0', y2: '0', gradientUnits: 'userSpaceOnUse' }, s('defs', {}, svg));
      const step = Math.max(1, Math.floor(data.temp.length / 96));
      data.temp.filter((_, i) => i % step === 0).forEach(([t, v]) => {
        s('stop', { offset: (frame.x(t) / HW).toFixed(4), 'stop-color': lightCss(v / 100) }, grad);
      });

      segments(dimSeries).forEach((seg) => {
        if (seg.length < 2) return;
        const line = seg.map(([t, v], i) => (i ? 'L' : 'M') + frame.x(t).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
        s('path', { d: line + ' L' + frame.x(seg[seg.length - 1][0]).toFixed(1) + ',' + BOTTOM + ' L' + frame.x(seg[0][0]).toFixed(1) + ',' + BOTTOM + ' Z', fill: data.temp.length ? 'url(#' + gradId + ')' : 'var(--track)' }, svg);
        const stroke = s('path', { d: line, fill: 'none', 'stroke-width': 2, 'stroke-linejoin': 'round' }, svg);
        stroke.style.stroke = 'var(--text)';
        stroke.setAttribute('stroke-opacity', '0.55');
      });

      return withHover(svg, frame, H, dimSeries, (t) => {
        const temp = nearest(data.temp, t);
        const lux = nearest(data.lux, t);
        return [
          (data.dim.length ? 'lysstyrke <b>' + Math.round(nearest(data.dim, t)) + ' %</b>' : null),
          (temp != null ? 'varme <b>' + Math.round(temp) + ' %</b>' : null),
          (lux != null ? '<b>' + Math.round(lux) + ' lux</b>' : null),
        ].filter(Boolean).join(' · ');
      }, (t) => y(nearest(dimSeries, t)));
    }

    function luxChart(data) {
      const H = 74, TOP = 6, BOTTOM = 54;
      const frame = historyFrame(data);
      const maxLog = Math.max(2, Math.ceil(Math.log10(Math.max(...data.lux.map((p) => p[1]), 10))));
      const y = (v) => BOTTOM - (Math.log10(Math.max(1, v)) / maxLog) * (BOTTOM - TOP);
      const svg = s('svg', { class: 'history-chart', viewBox: '0 0 ' + HW + ' ' + H, role: 'img', 'aria-label': 'Dagslys målt av sensoren' });
      for (let e = 0; e <= maxLog; e++) {
        if (e !== 0 && e !== maxLog && maxLog > 3 && e % 2) continue;
        const l = s('line', { x1: HPAD_L, x2: HW - HPAD_R, y1: y(10 ** e), y2: y(10 ** e), 'stroke-width': 1 }, svg);
        l.style.stroke = e === 0 ? 'var(--border)' : 'var(--border-soft)';
        const t = s('text', { x: HPAD_L - 4, y: y(10 ** e) + 3, 'text-anchor': 'end' }, svg);
        t.textContent = 10 ** e >= 1000 ? (10 ** e / 1000) + 'k' : String(10 ** e);
      }
      timeTicks(frame, data.range, svg, TOP, BOTTOM);
      segments(data.lux).forEach((seg) => {
        if (seg.length < 2) return;
        const p = s('path', { d: seg.map(([t, v], i) => (i ? 'L' : 'M') + frame.x(t).toFixed(1) + ',' + y(v).toFixed(1)).join(' '), fill: 'none', 'stroke-width': 2, 'stroke-linejoin': 'round' }, svg);
        p.style.stroke = 'var(--sun)';
      });
      const wrap = withHover(svg, frame, H, data.lux, (t) => '<b>' + Math.round(nearest(data.lux, t)) + ' lux</b>', (t) => y(nearest(data.lux, t)));
      return h('div', { class: 'stack', style: 'gap:2px' }, [h('span', { class: 'small muted', text: 'Dagslys (lux)' }), wrap]);
    }

    function nearest(points, t) {
      let best = null;
      points.forEach((p) => { if (best == null || Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p; });
      return best ? best[1] : null;
    }

    // Crosshair, and a readout line above the graph: the latest values, or
    // those under the finger or pointer while it is over the graph
    function withHover(svg, frame, H, series, readoutHtml, dotY) {
      const readout = h('div', { class: 'history-readout', 'aria-live': 'polite' });
      const wrap = h('div', { class: 'history' }, [readout, svg]);
      const cross = s('line', { y1: 0, y2: H - 18, 'stroke-width': 1, visibility: 'hidden' }, svg);
      cross.style.stroke = 'var(--text)';
      const dot = s('circle', { r: 4, 'stroke-width': 2, visibility: 'hidden' }, svg);
      dot.style.fill = 'var(--text)';
      dot.style.stroke = 'var(--surface)';
      const label = (t, latest) => (latest ? 'Sist: ' : '<b>' + new Date(t).toLocaleString('nb-NO', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) + '</b> · ') + readoutHtml(t);
      const latest = series.length ? series[series.length - 1][0] : null;
      const leave = () => {
        readout.innerHTML = latest != null ? label(latest, true) : '';
        cross.setAttribute('visibility', 'hidden');
        dot.setAttribute('visibility', 'hidden');
      };
      const move = (evt) => {
        const box = svg.getBoundingClientRect();
        const vx = ((evt.clientX - box.left) / box.width) * HW;
        if (vx < HPAD_L || vx > HW - HPAD_R || !series.length) { leave(); return; }
        const t = frame.start + ((vx - HPAD_L) / (HW - HPAD_L - HPAD_R)) * (frame.end - frame.start);
        let p = series[0];
        series.forEach((q) => { if (Math.abs(q[0] - t) < Math.abs(p[0] - t)) p = q; });
        const px = frame.x(p[0]);
        cross.setAttribute('x1', px);
        cross.setAttribute('x2', px);
        cross.setAttribute('visibility', 'visible');
        dot.setAttribute('cx', px);
        dot.setAttribute('cy', dotY(p[0]));
        dot.setAttribute('visibility', 'visible');
        readout.innerHTML = label(p[0], false);
      };
      svg.addEventListener('pointermove', move);
      svg.addEventListener('pointerdown', move);
      svg.addEventListener('pointerleave', leave);
      leave();
      return wrap;
    }

    function buildTestColor(group) {
      const k = h('input', { type: 'number', min: '2000', max: '6500', step: '100', 'aria-label': 'Kelvin' });
      k.value = 3000;
      const msg = h('p', { class: 'hint' });
      const stopBtn = h('button', { type: 'button', text: 'Stopp', hidden: true });
      const btn = h('button', { type: 'button', text: 'Vis testfarge (30 s)' });
      let timer = null;
      const ended = () => {
        clearTimeout(timer);
        stopBtn.hidden = true;
        btn.disabled = false;
      };
      btn.addEventListener('click', () => {
        if (!group.deviceIds.length) { msg.textContent = 'Velg minst ett lys i rommet først.'; return; }
        btn.disabled = true;
        msg.textContent = 'Lagrer og viser...';
        // Save first, so the test uses the colour ranges just entered
        HomeyRef.api('POST', '/config', config).then(() => {
          savedJson = JSON.stringify(config);
          updateSaveBar();
          return HomeyRef.api('POST', '/test-color', { groupId: group.id, kelvin: Number(k.value) });
        }).then((res) => {
          const outside = (res.lights || []).filter((l) => !l.inRange).map((l) => l.name);
          const plain = (res.lights || []).filter((l) => !l.calibrated).map((l) => l.name);
          msg.textContent = 'Alle lysene viser nå ' + res.kelvin + ' K i ' + res.seconds + ' sekunder. Ser en lampe annerledes ut enn de andre, juster fargeområdet dens.'
            + (outside.length ? ' Utenfor området til: ' + outside.join(', ') + ' (de viser det nærmeste de klarer).' : '')
            + (plain.length ? ' Uten fargeområde: ' + plain.join(', ') + '.' : '');
          stopBtn.hidden = false;
          timer = setTimeout(() => { ended(); msg.textContent = 'Ferdig. Lysene har fått tilbake det de hadde.'; }, res.seconds * 1000);
        }).catch((err) => {
          ended();
          msg.textContent = 'Kunne ikke vise testfarge: ' + (err && err.message ? err.message : err);
        });
      });
      stopBtn.addEventListener('click', () => {
        HomeyRef.api('POST', '/test-color-stop').then(() => { ended(); msg.textContent = 'Stoppet. Lysene har fått tilbake det de hadde.'; }).catch(() => {});
      });
      return h('div', { class: 'stack', style: 'gap:6px; border-top: 1px solid var(--border-soft); padding-top: 10px' }, [
        h('div', { class: 'simulate-row' }, [k, h('span', { class: 'small muted', text: 'K' }), btn, stopBtn]),
        h('p', { class: 'hint', text: 'Viser samme farge på alle lysene i rommet, så du kan sammenligne dem og justere fargeområdet. Lysene som er av, slås på under testen.' }),
        msg,
      ]);
    }

        return wrap;
      }
      wrap.append(labeledRow('Vekketid hverdager', timeField(group.wakeUpTime || '06:30', (v) => { group.wakeUpTime = v; updateSaveBar(); })));
      wrap.append(labeledRow('Vekketid helg og røde dager', timeField(group.wakeUpWeekendTime || '', (v) => { group.wakeUpWeekendTime = v; updateSaveBar(); })));
      const len = h('input', { type: 'number', min: '5', max: '60', step: '5' });
      len.value = group.wakeUpMinutes || 20;
      len.addEventListener('change', () => {
        let v = Number(len.value);
        if (Number.isNaN(v)) v = 20;
        v = clamp(Math.round(v), 5, 60);
        len.value = v;
        group.wakeUpMinutes = v;
        updateSaveBar();
      });
      wrap.append(labeledRow('Varighet (minutter)', len));
      wrap.append(h('p', { class: 'hint', text: 'Lysene som er av ved start, slås på helt svakt og varmt og glir opp til planens verdier ved vekketid. Lys som allerede er på, røres ikke. Slår du et lys av underveis, stopper vekkingen for det. La helgetiden stå tom for å ikke vekke i helger og på røde dager.' }));
      return wrap;
    }

    // A light's colour temperature range in kelvin, shared by every room.
    // Lets lights of different brands show the same colour for the same plan.
    const RANGE_PRESETS = [[2200, 4000, 'IKEA'], [2200, 6500, 'Philips Hue'], [2700, 6500, '']];

    function calibrationEditor(d, onDone) {
      config.calibration = config.calibration || {};
      const cal = config.calibration[d.id] || {};
      const warm = h('input', { type: 'number', min: '1500', max: '7000', step: '100', placeholder: 'f.eks. 2200', 'aria-label': 'Varmeste (K)' });
      const cool = h('input', { type: 'number', min: '1500', max: '10000', step: '100', placeholder: 'f.eks. 4000', 'aria-label': 'Kaldeste (K)' });
      warm.value = cal.warmK || '';
      cool.value = cal.coolK || '';
      const msg = h('p', { class: 'hint' });
      const apply = () => {
        const w = Number(warm.value), c = Number(cool.value);
        if (!warm.value && !cool.value) {
          delete config.calibration[d.id];
          msg.textContent = 'Ikke justert: lampen får planens verdi som den er.';
        } else if (w > 0 && c > w) {
          config.calibration[d.id] = { warmK: w, coolK: c };
          msg.textContent = 'Lampen får nå samme farge som planen, så langt området rekker.';
        } else {
          msg.textContent = 'Kaldeste må være høyere enn varmeste.';
          return;
        }
        updateSaveBar();
      };
      warm.addEventListener('change', apply);
      cool.addEventListener('change', apply);
      const presets = h('div', { class: 'simulate-row' }, RANGE_PRESETS.map(([w, c, brand]) => h('button', {
        type: 'button',
        text: w + '–' + c + ' K' + (brand ? ' (' + brand + ')' : ''),
        onclick: () => { warm.value = w; cool.value = c; apply(); },
      })).concat([h('button', { type: 'button', text: 'Nullstill', onclick: () => { warm.value = ''; cool.value = ''; apply(); } })]));
      return h('div', { class: 'kf-panel', style: 'width:100%' }, [
        h('div', { class: 'row' }, [h('label', { text: 'Varmeste (K)' }), warm]),
        h('div', { class: 'row' }, [h('label', { text: 'Kaldeste (K)' }), cool]),
        presets,
        h('p', { class: 'hint', text: 'Fargeområdet står i lampens manual eller på produktsiden. Gjelder lampen i alle rom.' }),
        msg,
        h('div', { class: 'row' }, [h('span'), h('button', { type: 'button', class: 'link', text: 'Ferdig', onclick: onDone })]),
      ]);
    }

    function buildCommonControls(group) {
      const wrap = h('div', { class: 'stack' });
      wrap.append(labeledRow('Ikke rør lys som er slått av', switchButton(group.skipOffLights !== false, 'Ikke rør lys som er slått av', (on) => {
        group.skipOffLights = on;
        updateSaveBar();
      })));

      const fade = h('input', { type: 'number', min: '0', max: '5', step: '1' });
      fade.value = group.fadeSeconds != null ? group.fadeSeconds : 2;
      fade.addEventListener('change', () => {
        let v = Number(fade.value);
        if (Number.isNaN(v)) v = 2;
        v = clamp(Math.round(v), 0, 5);
        fade.value = v;
        group.fadeSeconds = v;
        updateSaveBar();
      });
      wrap.append(labeledRow('Myk overgang (sekunder, 0–5)', fade));
      wrap.append(h('p', { class: 'hint', text: 'Lysene glir over til nye verdier i stedet for å hoppe. Ikke alle lys støtter det. Når et lys slås på, får det riktige verdier med en gang.' }));
      return wrap;
    }

    function renderDeviceList(container, group) {
      if (devices.length === 0) {
        container.append(h('p', { class: 'hint', text: 'Fant ingen lys som kan styres (verken fargetemperatur eller lysstyrke).' }));
        return;
      }
      if (devices.some((d) => !d.hasTemp) && group.mode !== 'keyframes' && !group.adjustBrightness) {
        container.append(h('p', { class: 'hint', style: 'color: var(--warn)', text: 'Lys uten fargetemperatur får ingen justering med «Følg sola» før du skrur på «Juster også lysstyrke».' }));
      }
      devices.forEach((d) => {
        const cb = h('input', { type: 'checkbox', id: 'dev-' + d.id });
        cb.checked = (group.deviceIds || []).includes(d.id);
        cb.addEventListener('change', () => {
          if (cb.checked) {
            if (!group.deviceIds.includes(d.id)) group.deviceIds.push(d.id);
          } else {
            group.deviceIds = group.deviceIds.filter((id) => id !== d.id);
          }
          updateSaveBar();
        });
        const row = h('div', { class: 'device' }, [
          cb,
          h('label', { for: 'dev-' + d.id, text: d.name + (d.zone ? ' (' + d.zone + ')' : '') }),
          !d.hasTemp ? h('span', { class: 'tag', text: 'kun lysstyrke' }) : null,
        ]);
        if (d.hasTemp) {
          const cal = config.calibration && config.calibration[d.id];
          row.append(h('button', {
            type: 'button',
            class: 'link',
            style: 'font-size: 13px',
            text: cal ? cal.warmK + '–' + cal.coolK + ' K' : 'Fargeområde',
            title: 'Juster for lampens fargeområde, så den viser samme farge som andre lamper',
            onclick: () => {
              const open = row.querySelector('.kf-panel');
              if (open) { open.remove(); return; }
              row.append(calibrationEditor(d, () => render()));
            },
          }));
        }
        const l = lightStatus(d.id);
        const lock = l ? l.lock : (d.locked ? d.lockType || 'manual' : null);
        if (lock) {
          row.append(h('span', { class: 'tag locked', text: lock === 'untilOff' ? '⏸ pause til av' : '🔒 låst' }));
          row.append(h('button', {
            type: 'button',
            class: 'link',
            text: 'Lås opp',
            onclick: () => HomeyRef.api('POST', '/resume', { deviceId: d.id }).then(() => {
              d.locked = false;
              return loadStatus();
            }).then(render).catch((err) => updateSaveBar('Kunne ikke låse opp: ' + err.message, 'dirty')),
          }));
        }
        container.append(row);
      });
    }

    function buildSimulateRow(group) {
      const btn = h('button', { type: 'button', text: '▶ Simuler døgnet (~1 min)', title: 'Kjører gjennom hele døgnet på ca. 1 minutt på lysene i rommet, så du ser effekten med det samme.' });
      const stopBtn = h('button', { type: 'button', text: '■ Stopp', disabled: true });
      const msg = h('span', { class: 'hint' });
      let pollTimer = null;

      const setRunning = (running) => { btn.disabled = running; stopBtn.disabled = !running; };
      function poll() {
        HomeyRef.api('GET', '/simulate-status').then((st) => {
          if (!st || !st.running) {
            clearInterval(pollTimer);
            pollTimer = null;
            setRunning(false);
            msg.textContent = st && st.stoppedReason ? st.stoppedReason + ' ✓' : 'Ferdig ✓ (tilbake til vanlig plan)';
            setTimeout(() => { msg.textContent = ''; }, 5000);
            return;
          }
          const p = st.totalSteps ? Math.round((st.stepIndex / st.totalSteps) * 100) : 0;
          msg.textContent = 'Simulerer kl. ' + (st.simTime || '--:--') + ' (' + p + ' %)';
        }).catch(() => { /* the next poll retries */ });
      }
      btn.addEventListener('click', () => {
        if (!group.deviceIds || group.deviceIds.length === 0) {
          msg.textContent = 'Velg minst ett lys i rommet først.';
          return;
        }
        setRunning(true);
        msg.textContent = 'Lagrer og starter...';
        // Save first, so the simulation uses exactly what is shown here
        HomeyRef.api('POST', '/config', config).then(() => {
          savedJson = JSON.stringify(config);
          updateSaveBar();
          return HomeyRef.api('POST', '/simulate', { groupId: group.id });
        }).then(() => {
          poll();
          pollTimer = setInterval(poll, 1000);
        }).catch((err) => {
          setRunning(false);
          msg.textContent = 'Kunne ikke starte: ' + (err && err.message ? err.message : err);
        });
      });
      stopBtn.addEventListener('click', () => {
        stopBtn.disabled = true;
        msg.textContent = 'Stopper...';
        HomeyRef.api('POST', '/simulate-stop').catch(() => {});
      });
      return h('div', { class: 'simulate-row' }, [btn, stopBtn, msg]);
    }

    // --- top level ---

    function render() {
      const root = document.getElementById('app');
      root.innerHTML = '';
      root.className = 'stack';
      refreshDial = null;
      const group = view.name === 'room' && config.groups.find((g) => g.id === view.groupId);
      if (group) renderRoom(root, group);
      else {
        view = { name: 'overview' };
        renderOverview(root);
      }
      updateSaveBar();
    }

    function onHomeyReady(Homey) {
      HomeyRef = Homey;
      Homey.ready();

      if (!C) {
        document.getElementById('app').textContent = 'Kunne ikke laste circadian.js. Prøv å installere appen på nytt.';
        return;
      }

      Promise.all([
        Homey.api('GET', '/devices'),
        Homey.api('GET', '/config'),
        Homey.api('GET', '/status').catch(() => null),
        Homey.api('GET', '/sensors').catch(() => []),
      ]).then(([deviceList, cfg, st, sensorList]) => {
        devices = deviceList || [];
        sensors = sensorList || [];
        config = normalizeConfig(cfg);
        savedJson = JSON.stringify(config);
        status = st;
        render();
      }).catch((err) => {
        document.getElementById('app').textContent = 'Kunne ikke laste: ' + (err && err.message ? err.message : JSON.stringify(err));
      });

      // Any edit on the page may have changed the config
      document.addEventListener('input', () => updateSaveBar());
      document.addEventListener('change', () => updateSaveBar());

      document.getElementById('save').addEventListener('click', save);
      document.getElementById('applyNow').addEventListener('click', () => {
        updateSaveBar('Oppdaterer lysene...');
        HomeyRef.api('POST', '/apply').then(() => {
          updateSaveBar('Oppdatert ✓', 'ok');
          setTimeout(() => updateSaveBar(), 2000);
          return loadStatus();
        }).catch((err) => updateSaveBar('Kunne ikke oppdatere: ' + err.message, 'dirty'));
      });

      // Keep the overview (and the hand on the clock) current while open
      setInterval(() => {
        if (document.hidden) return;
        if (view.name === 'overview') loadStatus();
        else if (refreshDial) refreshDial();
      }, 15000);
    }
  </script>
</body>
</html>
