        h('div', { class: 'row' }, [h('label', { text: tr('settings.coolestK') }), cool]),
        presets,
        h('p', { class: 'hint', text: tr('settings.calHint') }),
        msg,
        h('div', { class: 'row' }, [h('span'), h('button', { type: 'button', class: 'link', text: tr('settings.done'), onclick: onDone })]),
      ]);
    }

    function buildCommonControls(group) {
      const wrap = h('div', { class: 'stack' });
      wrap.append(labeledRow(tr('settings.skipOff'), switchButton(group.skipOffLights !== false, tr('settings.skipOff'), (on) => {
        group.skipOffLights = on;
        updateSaveBar();
      })));

      const fade = h('input', { type: 'number', min: '0', max: '5', step: '1' });
      fade.value = group.fadeSeconds != null ? group.fadeSeconds : 2;
      fade.addEventListener('change', () => {
        let v = Number(fade.value);
        if (Number.isNaN(v)) v = 2;
        v = clamp(Math.round(v), 0, 5);
        fade.value = v;
        group.fadeSeconds = v;
        updateSaveBar();
      });
      wrap.append(labeledRow(tr('settings.fade'), fade));
      wrap.append(h('p', { class: 'hint', text: tr('settings.fadeHint') }));
      return wrap;
    }

    function renderDeviceList(container, group) {
      if (devices.length === 0) {
        container.append(h('p', { class: 'hint', text: tr('settings.noControllable') }));
        return;
      }
      if (devices.some((d) => !d.hasTemp) && group.mode !== 'keyframes' && !group.adjustBrightness) {
        container.append(h('p', { class: 'hint', style: 'color: var(--warn)', text: tr('settings.dimOnlyWarning') }));
      }
      devices.forEach((d) => {
        const cb = h('input', { type: 'checkbox', id: 'dev-' + d.id });
        cb.checked = (group.deviceIds || []).includes(d.id);
        cb.addEventListener('change', () => {
          if (cb.checked) {
            if (!group.deviceIds.includes(d.id)) group.deviceIds.push(d.id);
          } else {
            group.deviceIds = group.deviceIds.filter((id) => id !== d.id);
          }
          updateSaveBar();
        });
        const row = h('div', { class: 'device' }, [
          cb,
          h('label', { for: 'dev-' + d.id, text: d.name + (d.zone ? ' (' + d.zone + ')' : '') }),
          !d.hasTemp ? h('span', { class: 'tag', text: tr('settings.dimOnly') }) : null,
        ]);
        if (d.hasTemp) {
          const cal = config.calibration && config.calibration[d.id];
          row.append(h('button', {
            type: 'button',
            class: 'link',
            style: 'font-size: 13px',
            text: cal ? cal.warmK + '–' + cal.coolK + ' K' : tr('settings.colourRange'),
            title: tr('settings.colourRangeTitle'),
            onclick: () => {
              const open = row.querySelector('.kf-panel');
              if (open) { open.remove(); return; }
              row.append(calibrationEditor(d, () => render()));
            },
          }));
        }
        const l = lightStatus(d.id);
        const lock = l ? l.lock : (d.locked ? d.lockType || 'manual' : null);
        if (lock) {
          row.append(h('span', { class: 'tag locked', text: lock === 'untilOff' ? tr('settings.pausedTag') : tr('settings.lockedTag') }));
          row.append(h('button', {
            type: 'button',
            class: 'link',
            text: tr('settings.unlock'),
            onclick: (evt) => {
              const btn = evt.currentTarget;
              btn.textContent = '';
              unlock(d.id, btn, 18);
            },
          }));
        }
        if (l && l.reportedAt) row.append(h('span', { class: 'tag', text: reportedText(l.reportedAt) }));
        container.append(row);
      });
    }

    function buildSimulateRow(group) {
      const btn = h('button', { type: 'button', text: tr('settings.simulate'), title: tr('settings.simulateTitle') });
      const stopBtn = h('button', { type: 'button', text: tr('settings.simulateStop'), disabled: true });
      const msg = h('span', { class: 'hint' });
      let pollTimer = null;

      const setRunning = (running) => { btn.disabled = running; stopBtn.disabled = !running; };
      function poll() {
        HomeyRef.api('GET', '/simulate-status').then((st) => {
          if (!st || !st.running) {
            clearInterval(pollTimer);
            pollTimer = null;
            setRunning(false);
            msg.textContent = st && st.stoppedReason ? st.stoppedReason + ' ✓' : tr('settings.simulateDone');
            setTimeout(() => { msg.textContent = ''; }, 5000);
            return;
          }
          const p = st.totalSteps ? Math.round((st.stepIndex / st.totalSteps) * 100) : 0;
          msg.textContent = tr('settings.simulating') + (st.simTime || '--:--') + ' (' + p + ' %)';
        }).catch(() => { /* the next poll retries */ });
      }
      btn.addEventListener('click', () => {
        if (!group.deviceIds || group.deviceIds.length === 0) {
          msg.textContent = tr('settings.chooseLightFirst');
          return;
        }
        setRunning(true);
        msg.textContent = tr('settings.savingAndStarting');
        // Save first, so the simulation uses exactly what is shown here
        HomeyRef.api('POST', '/config', config).then(() => {
          savedJson = JSON.stringify(config);
          updateSaveBar();
          return HomeyRef.api('POST', '/simulate', { groupId: group.id });
        }).then(() => {
          poll();
          pollTimer = setInterval(poll, 1000);
        }).catch((err) => {
          setRunning(false);
          msg.textContent = tr('settings.startFailed') + (err && err.message ? err.message : err);
        });
      });
      stopBtn.addEventListener('click', () => {
        stopBtn.disabled = true;
        msg.textContent = tr('settings.stopping');
        HomeyRef.api('POST', '/simulate-stop').catch(() => {});
      });
      return h('div', { class: 'simulate-row' }, [btn, stopBtn, msg]);
    }

    // --- top level ---

    function render() {
      const root = document.getElementById('app');
      root.innerHTML = '';
      root.className = 'stack';
      refreshDial = null;
      const group = view.name === 'room' && config.groups.find((g) => g.id === view.groupId);
      if (group) renderRoom(root, group);
      else {
        view = { name: 'overview' };
        renderOverview(root);
      }
      updateSaveBar();
    }

    function onHomeyReady(Homey) {
      HomeyRef = Homey;
      Homey.ready();
      document.getElementById('applyNow').textContent = tr('settings.applyNow');
      document.getElementById('save').textContent = tr('settings.save');
      document.documentElement.lang = tr('settings.locale');

      if (!C) {
        document.getElementById('app').textContent = tr('settings.loadMathFailed');
        return;
      }

      Promise.all([
        Homey.api('GET', '/devices'),
        Homey.api('GET', '/config'),
        Homey.api('GET', '/status').catch(() => null),
        Homey.api('GET', '/sensors').catch(() => []),
      ]).then(([deviceList, cfg, st, sensorList]) => {
        devices = deviceList || [];
        sensors = sensorList || [];
        config = normalizeConfig(cfg);
        savedJson = JSON.stringify(config);
        status = st;
        render();
      }).catch((err) => {
        document.getElementById('app').textContent = tr('settings.loadFailed') + (err && err.message ? err.message : JSON.stringify(err));
      });

      // Any edit on the page may have changed the config
      document.addEventListener('input', () => updateSaveBar());
      document.addEventListener('change', () => updateSaveBar());

      document.getElementById('save').addEventListener('click', save);
      document.getElementById('applyNow').addEventListener('click', () => {
        updateSaveBar(tr('settings.applying'));
        HomeyRef.api('POST', '/apply').then(() => {
          updateSaveBar(tr('settings.applied'), 'ok');
          setTimeout(() => updateSaveBar(), 2000);
          return loadStatus();
        }).catch((err) => updateSaveBar(tr('settings.applyFailed') + err.message, 'dirty'));
      });

      // Keep the overview (and the hand on the clock) current while open
      setInterval(() => {
        if (document.hidden) return;
        if (view.name === 'overview') loadStatus();
        else if (refreshDial) refreshDial();
      }, 15000);
    }
  </script>
</body>
</html>
